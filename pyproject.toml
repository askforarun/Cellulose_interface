[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellulose-ethanol-tools"
version = "0.7.0"
description = "Pack fixed-size molecular boxes for cellulose interfaces."
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

[project.scripts]
pack-liquid-cellulose = "pack_liquid_cellulose:cli"
parameterize-molecule = "parameterize_molecule:cli"
combine-gromacs-topologies = "combine_gromacs_topologies:main"
build-cellulose-slab = "build_cellulose_slab:cli"
prepare-water-model = "prepare_water_model:main"

[tool.setuptools]
py-modules = ["pack_liquid_cellulose", "parameterize_molecule", "combine_gromacs_topologies", "build_cellulose_slab", "prepare_water_model", "water_models"]
