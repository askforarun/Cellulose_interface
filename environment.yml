channels:
  - conda-forge

dependencies:
  # Interface-only additions to an environment created from CelluloseForge's
  # environment.yml. CelluloseForge already supplies Python, NumPy,
  # AmberTools, ParmEd, and pip.
  - openbabel>=3.1.1,<4
  - gromacs>=2024,<2027

  - pip:
      # The conda-forge AmberTools recipe intentionally conflicts with its
      # Packmol package. The official Packmol project supplies binary wheels.
      - packmol==21.2.3
      # Install this checkout's command-line entry points.
      - -e .
